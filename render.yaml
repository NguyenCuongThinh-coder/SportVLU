services:
  - type: web
    name: sportvlu
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /
    envVars:
      - key: SPORTSLOT_ENV
        value: production
      - key: SPORTSLOT_SECRET_KEY
        generateValue: true
      - key: SPORTSLOT_DB_PATH
        value: /tmp/sportslot.db
      - key: SPORTSLOT_ALLOW_EMPTY_DB
        value: "1"
      - key: SPORTSLOT_SEED_DEMO
        value: "1"
